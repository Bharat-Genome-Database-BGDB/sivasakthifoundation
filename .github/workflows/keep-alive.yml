name: Keep Supabase Database Alive

on:
  schedule:
    - cron: '0 0 */3 * *' # Runs every 3 days at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send API ping to Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/contact_submissions?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"